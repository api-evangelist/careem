name: Careem
description: 'Careem is the everything app for the greater Middle East, a super-app operating across the
  MENAP region (Middle East, North Africa, and Pakistan) and headquartered in Dubai, United Arab Emirates.
  Founded in 2012 and now owned by Uber, Careem combines mobility (rides, taxi, bike, car rental), food and
  grocery delivery (Careem Eat, Quik), courier and B2B logistics (Box, Express), and financial services
  (Careem Pay, remittance, donations) alongside the Careem Plus subscription. Careem does not currently
  operate a public developer API program or partner API portal; this profile captures its public identity,
  engineering surface, and domain-security posture within the API Evangelist network.'
